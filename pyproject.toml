# Ruff（リント・フォーマット）の設定。comken 本体と揃える。
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".pytest_cache", "typings"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "C90", "LOG", "G", "DTZ", "RUF", "TID"]
ignore = [
    # 日本語のコード・コメント・docstring を「紛らわしい文字」として大量に誤検知するため
    "RUF001", "RUF002", "RUF003",
    # __all__ は意味のまとまり順に並べているため、アルファベット順の強制は受け入れない
    "RUF022",
]

[tool.ruff.lint.flake8-tidy-imports]
# 相対 import は禁止。ドットを数える作業を残さないため。
# 必ず `from tester.X import Y` のようにパッケージルートから書く（CONVENTIONS.md 参照）
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
# 分岐の絡み合いの上限。1 つの関数が同時に複数のことをやる形になるのを防ぐ。
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# テストのフィクスチャは日本語の見出しや URL を含むので、行が 100 字を超える。改行すると
# データ構造が壊れて読みづらくなるため、テストに限り E501 を許容する。
# C901（mccabe）はテストヘルパが分岐を持ちやすく、検証網羅が歪むため除外する。
"tests/**/*.py" = ["E501", "C901"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
# 開発時は隣接する comken リポジトリとダウンローダーを直接参照する。
# ダウンローダーの `src` を import するため、その親をパスに入れておく。
extraPaths = [".", "../comken", "../Salesforceレポートダウンローダー"]
