# Ruff（リント・フォーマット）の設定。comken 本体と揃える。
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".pytest_cache", "typings"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "C90", "LOG", "G", "DTZ", "RUF", "TID"]
ignore = [
    # 日本語のコード・コメント・docstring を「紛らわしい文字」として大量に誤検知するため
    "RUF001", "RUF002", "RUF003",
    # __all__ は意味のまとまり順に並べているため、アルファベット順の強制は受け入れない
    "RUF022",
]

[tool.ruff.lint.flake8-tidy-imports]
# 相対 import は禁止。ドットを数える作業を残さないため。
# 必ず `from src.X import Y` のようにパッケージルートから書く（CONVENTIONS.md 参照）
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
# 分岐の絡み合いの上限。1 つの関数が同時に複数のことをやる形になるのを防ぐ。
max-complexity = 10

[tool.pyright]
# 開発時は隣接する comken リポジトリを直接参照する。
extraPaths = [".", "../comken"]
